<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTIDAS - BERISSO</title>

<style>
body{
    margin:0;
    background:#0a0a0a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

/* tablero principal */
.board{
    width:900px;
    background:#111;
    padding:30px;
    border-radius:8px;
    box-shadow:0 0 30px rgba(0,0,0,0.8);
}

/* header amarillo */
.title-wrap{
    background:#f5c400;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    padding:20px;
    margin-bottom:35px;
    border-radius:4px;
}

.plane-icon{
    font-size:32px;
}

.title{
    font-size:32px;
    font-weight:900;
    letter-spacing:8px;
}

/* reloj */
.clock-row{
    display:flex;
    justify-content:center;
    gap:10px;
}

.flap{
    width:95px;
    height:125px;
    background:#1c1c1c;
    color:#f5f1dc;
    font-size:72px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    border-radius:4px;
    transition:opacity 0.1s ease;
}

/* línea central tipo split flap */
.flap:after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#000;
    top:50%;
    left:0;
}

.separator{
    color:#666;
    font-size:72px;
    display:flex;
    align-items:center;
}

/* fecha */
.date{
    text-align:center;
    color:#999;
    font-size:24px;
    margin-top:30px;
    letter-spacing:4px;
}

/* footer */
.footer{
    text-align:center;
    color:white;
    margin-top:30px;
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
}

/* responsive para PlayBook */
@media(max-width:1024px){

    .board{
        width:95%;
        padding:20px;
    }

    .flap{
        width:60px;
        height:85px;
        font-size:42px;
    }

    .separator{
        font-size:42px;
    }

    .title{
        font-size:22px;
    }

    .footer{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="board">

    <div class="title-wrap">
        <div class="plane-icon">✈</div>
        <div class="title">PARTIDAS</div>
    </div>

    <div class="clock-row">
        <div class="flap" id="h1">0</div>
        <div class="flap" id="h2">0</div>

        <div class="separator">:</div>

        <div class="flap" id="m1">0</div>
        <div class="flap" id="m2">0</div>

        <div class="separator">:</div>

        <div class="flap" id="s1">0</div>
        <div class="flap" id="s2">0</div>
    </div>

    <div class="date" id="date">00 / 00 / 0000</div>

    <div class="footer">
        BERISSO, BUENOS AIRES, ARGENTINA
    </div>

</div>

<script>
function pad(n){
    return n < 10 ? "0" + n : n;
}

function setFlap(id,value){
    var el = document.getElementById(id);

    if(el.innerHTML !== value){
        el.innerHTML = value;

        // efecto visual simple compatible
        el.style.opacity = "0.5";

        setTimeout(function(){
            el.style.opacity = "1";
        },100);
    }
}

function updateClock(){
    var now = new Date();

    var h = pad(now.getHours());
    var m = pad(now.getMinutes());
    var s = pad(now.getSeconds());

    setFlap("h1", h.charAt(0));
    setFlap("h2", h.charAt(1));

    setFlap("m1", m.charAt(0));
    setFlap("m2", m.charAt(1));

    setFlap("s1", s.charAt(0));
    setFlap("s2", s.charAt(1));

    document.getElementById("date").innerHTML =
        pad(now.getDate()) + " / " +
        pad(now.getMonth() + 1) + " / " +
        now.getFullYear();
}

/* inicia reloj */
updateClock();

/* loop estable para PlayBook */
window.setInterval(function(){
    updateClock();
},1000);
</script>

</body>
</html>
