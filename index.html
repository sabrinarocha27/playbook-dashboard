<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBook Dashboard</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}

h1{
    font-size:24px;
}

.clock{
    font-size:60px;
    font-family:Courier New, monospace;
    line-height:1;
    margin-bottom:20px;
}

.date{
    font-size:20px;
    margin-bottom:30px;
}

.weather-box{
    background:#222;
    padding:20px;
    margin:20px auto;
    width:300px;
    border-radius:10px;
}

button{
    padding:10px 20px;
    margin-top:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>BlackBerry PlayBook Dashboard</h1>

<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date"></div>

<div class="weather-box">
    <h2>Clima</h2>
    <div id="weather-city">Sin ciudad</div>
    <div id="weather-temp">--°C</div>
    <div id="weather-desc">Sin datos</div>
</div>

<button onclick="setCity()">Configurar ciudad</button>

<div class="weather-box">
    <h2>Calendario</h2>
    <div>Calendario desactivado</div>
</div>

<script>
var city = localStorage.getItem("city") || "";

function pad(n){
    return n < 10 ? "0" + n : n;
}

function updateClock(){
    var now = new Date();

    var hours = pad(now.getHours());
    var minutes = pad(now.getMinutes());
    var seconds = pad(now.getSeconds());

    var day = pad(now.getDate());
    var month = pad(now.getMonth() + 1);
    var year = now.getFullYear();

    var time = hours + ":" + minutes + ":" + seconds;
    var date = day + "/" + month + "/" + year;

    document.getElementById("clock").innerHTML = time;
    document.getElementById("date").innerHTML = date;
}

setInterval(updateClock,1000);
updateClock();

function setCity(){
    var newCity = prompt("Ingresá tu ciudad:");

    if(newCity){
        city = newCity;
        localStorage.setItem("city", city);
        fetchWeather();
    }
}

function fetchWeather(){
    if(!city){
        return;
    }

    document.getElementById("weather-city").innerHTML = city;

    var geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city);

    var x = new XMLHttpRequest();
    x.open("GET", geoUrl, true);

    x.onload = function(){
        try{
            var geo = JSON.parse(x.responseText);

            if(!geo.results || !geo.results.length){
                document.getElementById("weather-desc").innerHTML = "Ciudad no encontrada";
                return;
            }

            var lat = geo.results[0].latitude;
            var lon = geo.results[0].longitude;

            var weatherUrl =
                "https://api.open-meteo.com/v1/forecast?latitude=" +
                lat +
                "&longitude=" +
                lon +
                "&current=temperature_2m,weather_code";

            var w = new XMLHttpRequest();
            w.open("GET", weatherUrl, true);

            w.onload = function(){
                try{
                    var data = JSON.parse(w.responseText);

                    document.getElementById("weather-temp").innerHTML =
                        Math.round(data.current.temperature_2m) + "°C";

                    document.getElementById("weather-desc").innerHTML =
                        "Código clima: " + data.current.weather_code;

                }catch(e){
                    document.getElementById("weather-desc").innerHTML = "Error clima";
                }
            };

            w.send();

        }catch(e){
            document.getElementById("weather-desc").innerHTML = "Error";
        }
    };

    x.send();
}

if(city){
    fetchWeather();
}

setInterval(fetchWeather,600000);
</script>

</body>
</html>
