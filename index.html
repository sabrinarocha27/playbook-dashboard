<script>
function pad(n){
    return n < 10 ? "0" + n : n;
}

function playClick(){
    try{
        var ctx = new (window.AudioContext || window.webkitAudioContext)();

        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        osc.type = "square";
        osc.frequency.value = 800;
        gain.gain.value = 0.02;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(0);
        osc.stop(ctx.currentTime + 0.03);
    }catch(e){
        console.log("audio no soportado");
    }
}

function setFlap(id,value){
    var el = document.getElementById(id);

    if(el.innerHTML !== value){

        el.classList.remove("flip");
        void el.offsetWidth;

        el.innerHTML = value;
        el.classList.add("flip");

        playClick();
    }
}

function updateClock(){
    var now = new Date();

    var h = pad(now.getHours());
    var m = pad(now.getMinutes());
    var s = pad(now.getSeconds());

    setFlap("h1", h.charAt(0));
    setFlap("h2", h.charAt(1));

    setFlap("m1", m.charAt(0));
    setFlap("m2", m.charAt(1));

    setFlap("s1", s.charAt(0));
    setFlap("s2", s.charAt(1));

    document.getElementById("date").innerHTML =
        pad(now.getDate()) + " / " +
        pad(now.getMonth()+1) + " / " +
        now.getFullYear();

    // más compatible que setInterval en navegadores viejos
    setTimeout(updateClock, 1000);
}

updateClock();
</script>
