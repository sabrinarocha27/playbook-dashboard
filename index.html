<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solari Split Flap Clock</title>

<style>
body{
    margin:0;
    background:#0a0a0a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

.board{
    width:900px;
    background:#111;
    padding:30px;
    border-radius:8px;
    box-shadow:0 0 30px rgba(0,0,0,0.8);
}

.title-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-bottom:30px;
}

.plane-box{
    width:50px;
    height:50px;
    border:3px solid #f5c542;
    color:#f5c542;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    border-radius:6px;
    box-shadow:0 0 10px rgba(245,197,66,0.3);
}

.title{
    color:#777;
    text-align:center;
    font-size:18px;
    letter-spacing:6px;
    margin-bottom:30px;
}

.clock-row{
    display:flex;
    justify-content:center;
    gap:8px;
}

.flap{
    width:90px;
    height:120px;
    background:#1c1c1c;
    color:#f5f1dc;
    font-size:70px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    border-radius:4px;
    box-shadow:inset 0 2px 5px rgba(255,255,255,0.05),
               inset 0 -4px 8px rgba(0,0,0,0.5);
}

.flap:after{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#000;
    top:50%;
    left:0;
}

.separator{
    color:#777;
    font-size:70px;
    display:flex;
    align-items:center;
}

.date{
    text-align:center;
    color:#999;
    font-size:24px;
    margin-top:30px;
    letter-spacing:4px;
}

.footer{
    text-align:center;
    color:#444;
    margin-top:25px;
    font-size:14px;
    letter-spacing:3px;
}

.flap.flip{
    animation:flipAnim 0.25s ease;
}

@keyframes flipAnim{
    0%{transform:rotateX(0deg)}
    50%{transform:rotateX(-90deg)}
    100%{transform:rotateX(0deg)}
}

@media(max-width:1024px){
    .board{
        width:95%;
    }

    .flap{
        width:60px;
        height:90px;
        font-size:45px;
    }
}

    .flap{
        width:60px;
        height:90px;
        font-size:45px;
    }
}
</style>
</head>
<body>

<div class="board">
    <div class="title-wrap">
    <div class="plane-box">✈</div>
    <div class="title">PARTIDAS</div>
</div>

    <div class="clock-row">
        <div class="flap" id="h1">0</div>
        <div class="flap" id="h2">0</div>

        <div class="separator">:</div>

        <div class="flap" id="m1">0</div>
        <div class="flap" id="m2">0</div>

        <div class="separator">:</div>

        <div class="flap" id="s1">0</div>
        <div class="flap" id="s2">0</div>
    </div>

    <div class="date" id="date">00 / 00 / 0000</div>

    <div class="footer">
    BERISSO, BUENOS AIRES, ARGENTINA
</div>
</div>

<script>
function pad(n){
    return n < 10 ? "0" + n : n;
}

function playClick(){
    try{
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        osc.type = "square";
        osc.frequency.value = 900;
        gain.gain.value = 0.03;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.03);
    }catch(e){}
}

function setFlap(id,value){
    var el = document.getElementById(id);

    if(el.innerHTML !== value){
        el.classList.remove("flip");
        void el.offsetWidth;
        el.classList.add("flip");
        el.innerHTML = value;
        playClick();
    }
}

function updateClock(){
    var now = new Date();

    var h = pad(now.getHours());
    var m = pad(now.getMinutes());
    var s = pad(now.getSeconds());

        setFlap("h1", h.charAt(0));
    setFlap("h2", h.charAt(1));

    setFlap("m1", m.charAt(0));
    setFlap("m2", m.charAt(1));

    setFlap("s1", s.charAt(0));
    setFlap("s2", s.charAt(1));

    document.getElementById("date").innerHTML =
        pad(now.getDate()) + " / " +
        pad(now.getMonth()+1) + " / " +
        now.getFullYear();
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
