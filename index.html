<script>
function pad(n){
    if(n < 10){
        return "0" + n;
    }
    return n;
}

function setFlap(id,value){
    var el = document.getElementById(id);

    if(el.textContent !== value){
        el.textContent = value;

        // pequeño efecto visual sin romper PlayBook
        el.style.opacity = "0.6";

        setTimeout(function(){
            el.style.opacity = "1";
        },80);
    }
}

function updateClock(){
    var now = new Date();

    var hours = pad(now.getHours());
    var minutes = pad(now.getMinutes());
    var seconds = pad(now.getSeconds());

    setFlap("h1", hours.charAt(0));
    setFlap("h2", hours.charAt(1));

    setFlap("m1", minutes.charAt(0));
    setFlap("m2", minutes.charAt(1));

    setFlap("s1", seconds.charAt(0));
    setFlap("s2", seconds.charAt(1));

    var dateText =
        pad(now.getDate()) +
        " / " +
        pad(now.getMonth() + 1) +
        " / " +
        now.getFullYear();

    document.getElementById("date").textContent = dateText;

    // más estable en navegadores viejos
    setTimeout(updateClock, 1000);
}

// iniciar
updateClock();
</script>
